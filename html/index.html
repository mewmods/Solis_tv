<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Solis TV — Controle remoto</title>
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('solistv-theme');
                if (saved === 'light' || saved === 'dark') {
                    document.documentElement.setAttribute('data-theme', saved);
                }
            } catch (e) { }
        })();
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-tv" viewBox="0 0 24 24">
        <rect x="2.75" y="7.25" width="18.5" height="12.5" rx="2.5"/>
        <path d="M8.5 3.5 12 7.25l3.5-3.75"/>
    </symbol>
    <symbol id="i-home" viewBox="0 0 24 24">
        <path d="M4 10.4 12 3.8l8 6.6V19a1.6 1.6 0 0 1-1.6 1.6H5.6A1.6 1.6 0 0 1 4 19z"/>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M12 5.5v13M5.5 12h13"/>
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="6.75"/>
        <path d="m16.2 16.2 4.3 4.3"/>
    </symbol>
    <symbol id="i-close" viewBox="0 0 24 24">
        <path d="m6.5 6.5 11 11M17.5 6.5l-11 11"/>
    </symbol>
    <symbol id="i-play" viewBox="0 0 24 24">
        <path d="M8.5 5.6v12.8L19 12z" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="i-pause" viewBox="0 0 24 24">
        <path d="M8.6 5.5h3.1v13H8.6zM12.3 5.5h3.1v13h-3.1z" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="i-prev" viewBox="0 0 24 24">
        <path d="M18 6.3v11.4L9.2 12z" fill="currentColor" stroke="none"/>
        <path d="M6.2 6v12" stroke-width="2"/>
    </symbol>
    <symbol id="i-next" viewBox="0 0 24 24">
        <path d="M6 6.3v11.4L14.8 12z" fill="currentColor" stroke="none"/>
        <path d="M17.8 6v12" stroke-width="2"/>
    </symbol>
    <symbol id="i-back" viewBox="0 0 24 24">
        <path d="M11.5 7.5 6.8 12l4.7 4.5M18 7.5 13.3 12l4.7 4.5"/>
    </symbol>
    <symbol id="i-fwd" viewBox="0 0 24 24">
        <path d="M6 7.5 10.7 12 6 16.5M12.5 7.5 17.2 12l-4.7 4.5"/>
    </symbol>
    <symbol id="i-cc" viewBox="0 0 24 24">
        <rect x="2.6" y="5.6" width="18.8" height="12.8" rx="3"/>
        <path d="M9.6 10.1a2.6 2.6 0 1 0 0 3.8M16.4 10.1a2.6 2.6 0 1 0 0 3.8"/>
    </symbol>
    <symbol id="i-volume" viewBox="0 0 24 24">
        <path d="M4 9.6h3.1L11.4 6v12L7.1 14.4H4z"/>
        <path d="M15.2 9.2a4.4 4.4 0 0 1 0 5.6M17.8 6.6a8 8 0 0 1 0 10.8"/>
    </symbol>
    <symbol id="i-mute" viewBox="0 0 24 24">
        <path d="M4 9.6h3.1L11.4 6v12L7.1 14.4H4z"/>
        <path d="m15.4 9.6 4.4 4.8M19.8 9.6l-4.4 4.8"/>
    </symbol>
    <symbol id="i-power" viewBox="0 0 24 24">
        <path d="M12 3.4v8.2"/>
        <path d="M7.2 6.6a7.4 7.4 0 1 0 9.6 0"/>
    </symbol>
    <symbol id="i-trash" viewBox="0 0 24 24">
        <path d="M4.5 7h15M9.4 7V4.6h5.2V7M6.8 7l.9 12.4h8.6L17.2 7"/>
    </symbol>
    <symbol id="i-grip" viewBox="0 0 24 24">
        <g fill="currentColor" stroke="none">
            <circle cx="9" cy="7" r="1.25"/><circle cx="15" cy="7" r="1.25"/>
            <circle cx="9" cy="12" r="1.25"/><circle cx="15" cy="12" r="1.25"/>
            <circle cx="9" cy="17" r="1.25"/><circle cx="15" cy="17" r="1.25"/>
        </g>
    </symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24">
        <path d="M14.5 5.5 8 12l6.5 6.5"/>
    </symbol>
    <symbol id="i-sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4.1"/>
        <path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7"/>
    </symbol>
    <symbol id="i-moon" viewBox="0 0 24 24">
        <path d="M20.2 14.6A8.6 8.6 0 1 1 10.4 3.8a6.9 6.9 0 0 0 9.8 10.8z"/>
    </symbol>
    <symbol id="i-check" viewBox="0 0 24 24">
        <path d="m5 12.6 4.6 4.5L19 7.5"/>
    </symbol>
    <symbol id="i-alert" viewBox="0 0 24 24">
        <path d="M12 4.4 21 19.6H3z"/>
        <path d="M12 9.9v4.4" stroke-width="2"/>
        <circle cx="12" cy="17.1" r="0.9" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="i-info" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8.6"/>
        <path d="M12 11v5.2" stroke-width="2"/>
        <circle cx="12" cy="7.9" r="0.95" fill="currentColor" stroke="none"/>
    </symbol>
</svg>

<div id="toast-container"></div>

<div id="app">
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="brand">
            <span class="brand-mark"><svg class="ico"><use href="#i-tv"></use></svg></span>
            <span class="brand-text">
                <strong>Solis TV</strong>
                <small>Controle remoto</small>
            </span>
        </div>

        <div class="signal-card" id="tv-status-card" title="Status da TV">
            <span class="signal-dot"></span>
            <div class="signal-text">
                <span class="signal-label">Sinal</span>
                <span class="signal-value" id="sidebar-tv-status">Conectado</span>
            </div>
        </div>

        <nav class="nav">
            <button type="button" class="menu-item active" id="btn-home">
                <svg class="ico"><use href="#i-home"></use></svg>
                <span>Início</span>
            </button>
        </nav>

        <div class="playlists-header">
            <span>Playlists</span>
            <button type="button" class="icon-btn icon-btn-xs" id="create-playlist-btn" title="Criar playlist">
                <svg class="ico"><use href="#i-plus"></use></svg>
            </button>
        </div>
        <div class="playlists" id="playlist-list"></div>

        <div class="sidebar-foot">
            <span class="sidebar-foot-label">Tema</span>
            <button type="button" class="theme-toggle" id="theme-toggle" title="Alternar tema">
                <span class="theme-opt" data-theme-opt="light"><svg class="ico"><use href="#i-sun"></use></svg></span>
                <span class="theme-opt" data-theme-opt="dark"><svg class="ico"><use href="#i-moon"></use></svg></span>
            </button>
        </div>
    </aside>

    <!-- MAIN -->
    <main class="main">
        <header class="topbar">
            <div class="search">
                <svg class="ico search-ico"><use href="#i-search"></use></svg>
                <input type="text" id="search-input" placeholder="Buscar vídeos ou colar um link do YouTube">
                <button type="button" class="search-go" id="search-btn" title="Buscar">
                    <svg class="ico"><use href="#i-search"></use></svg>
                </button>
            </div>
            <button type="button" class="icon-btn" id="close-btn" title="Fechar controle">
                <svg class="ico"><use href="#i-close"></use></svg>
            </button>
        </header>

        <!-- HOME -->
        <section class="view is-active" id="home-view">
            <div class="scroller">
                <div id="default-home-content">
                    <div class="section">
                        <div class="section-head">
                            <h2 class="section-title">Tocados recentemente</h2>
                        </div>
                        <div class="recent-grid" id="recent-grid"></div>
                    </div>

                    <div class="section">
                        <div class="section-head">
                            <h2 class="section-title">Suas playlists</h2>
                        </div>
                        <div class="playlists-grid" id="playlists-grid"></div>
                    </div>
                </div>

                <div class="content-area" id="results-area" style="display: none;"></div>
            </div>
        </section>

        <!-- PLAYLIST -->
        <section class="view" id="playlist-view">
            <div class="playlist-view-header">
                <button type="button" class="ghost-btn" id="back-to-home">
                    <svg class="ico"><use href="#i-arrow-left"></use></svg>
                    <span>Voltar</span>
                </button>
                <h2 id="pl-view-name">Playlist</h2>
                <button type="button" class="solid-btn" id="pl-play-all">
                    <svg class="ico"><use href="#i-play"></use></svg>
                    <span>Tocar na TV</span>
                </button>
            </div>
            <div class="pl-songs-scroll">
                <ul id="pl-songs-container"></ul>
            </div>
        </section>
    </main>

    <!-- PLAYER / CONTROLE REMOTO -->
    <footer class="player-footer">
        <div class="progress-row">
            <span class="time" id="curr-time">0:00</span>
            <input type="range" id="seek-bar" min="0" max="100" value="0" step="0.1">
            <span class="time" id="total-time">--:--</span>
        </div>

        <div class="controls-row">
            <div class="now-playing">
                <div class="now-title" id="current-song-title">Nenhum vídeo em reprodução</div>
                <div class="now-meta">
                    <span class="device-tag" id="current-device-tag"><svg class="ico"><use href="#i-tv"></use></svg> Solis TV</span>
                    <button type="button" class="power-btn" id="btn-power-tv" title="Desligar TV">
                        <svg class="ico"><use href="#i-power"></use></svg>
                        <span>Desligar</span>
                    </button>
                </div>
            </div>

            <div class="transport">
                <button type="button" class="ctrl" id="btn-backward-10" title="Voltar 10s">
                    <svg class="ico"><use href="#i-back"></use></svg>
                </button>
                <button type="button" class="ctrl" id="prev-btn" title="Anterior">
                    <svg class="ico"><use href="#i-prev"></use></svg>
                </button>
                <button type="button" class="ctrl ctrl-play" id="play-pause-btn" title="Play / Pause">
                    <svg class="ico"><use href="#i-play"></use></svg>
                </button>
                <button type="button" class="ctrl" id="next-btn" title="Próximo">
                    <svg class="ico"><use href="#i-next"></use></svg>
                </button>
                <button type="button" class="ctrl" id="btn-forward-10" title="Avançar 10s">
                    <svg class="ico"><use href="#i-fwd"></use></svg>
                </button>

                <span class="transport-divider"></span>

                <button type="button" class="pill" id="btn-toggle-cc" title="Alternar legendas">
                    <svg class="ico"><use href="#i-cc"></use></svg>
                    <span>CC</span>
                </button>
                <button type="button" class="pill" id="btn-speed" title="Velocidade de reprodução">1.0x</button>
            </div>

            <div class="volume">
                <button type="button" class="ctrl ctrl-sm" id="vol-icon" title="Mutar / desmutar">
                    <svg class="ico"><use href="#i-volume"></use></svg>
                </button>
                <input type="range" id="volume-slider" min="0" max="100" value="50">
            </div>
        </div>
    </footer>

    <!-- MODAL -->
    <div id="custom-modal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h3 id="modal-title">Nome</h3>
            <input type="text" id="modal-input" placeholder="Digite aqui...">
            <div class="modal-buttons">
                <button type="button" class="ghost-btn" id="modal-cancel">Cancelar</button>
                <button type="button" class="solid-btn" id="modal-confirm">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- CONTEXT MENU -->
    <div id="context-menu" class="context-menu">
        <div class="context-header">Adicionar à playlist</div>
        <ul id="context-playlist-list"></ul>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
